[project]
name = "rat-detection-lab-backend"
version = "0.1.0"
description = "Defensive, simulation-only Android RAT detection lab — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.26",
    "ruff>=0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic autogenerates these; don't lint generated migration scaffolding.
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
